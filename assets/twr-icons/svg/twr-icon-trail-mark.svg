<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Hidden trail mark">
  <defs>
    <style>
      .ink { fill: none; stroke: #3a3228; stroke-linecap: round; stroke-linejoin: round; }
      .faint { opacity: 0.4; }
      .label { font: 6px "Segoe Print", "Bradley Hand", cursive; fill: #4a4034; }
    </style>
  </defs>
  <!-- stones -->
  <path class="ink" d="M28 78 Q34 68 42 78 Q48 72 56 78 Q62 70 72 78 Q78 72 88 78" stroke-width="1.4"/>
  <ellipse class="ink faint" cx="38" cy="76" rx="8" ry="5" stroke-width="1"/>
  <ellipse class="ink faint" cx="60" cy="74" rx="10" ry="6" stroke-width="1"/>
  <ellipse class="ink faint" cx="78" cy="76" rx="7" ry="5" stroke-width="1"/>
  <!-- secret notch -->
  <path class="ink" d="M57 74 L63 74 M60 71 L60 77" stroke-width="1.3"/>
  <circle class="ink faint" cx="60" cy="74" r="1.2" fill="#3a3228"/>
  <!-- obvious blaze crossed out -->
  <path class="ink faint" d="M18 48 L28 38 M28 48 L18 38" stroke-width="1.2"/>
  <path class="ink faint" d="M20 42 L26 44" stroke-width="0.8"/>
  <text class="label" x="12" y="58">too obvious</text>
  <!-- private mark -->
  <path class="ink" d="M54 58 L66 58" stroke-width="1"/>
  <text class="label" x="48" y="54">secret mark</text>
  <text class="label" x="30" y="92">stones · not blaze</text>
</svg>
