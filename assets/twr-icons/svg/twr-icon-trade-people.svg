<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Trade first">
  <defs>
    <style>
      .ink { fill: none; stroke: #3a3228; stroke-linecap: round; stroke-linejoin: round; }
      .faint { opacity: 0.42; }
      .label { font: 6px "Segoe Print", "Bradley Hand", cursive; fill: #4a4034; }
    </style>
  </defs>
  <!-- left hand open -->
  <path class="ink" d="M22 58 Q18 48 24 42 Q30 38 34 44 L38 56 Q40 64 34 68 Q28 72 22 66 Z" stroke-width="1.3"/>
  <!-- right hand offered but held back -->
  <path class="ink" d="M78 58 Q82 48 76 42 Q70 38 66 44 L62 56 Q60 64 66 68 Q72 72 78 66 Z" stroke-width="1.3"/>
  <!-- clasp gap -->
  <path class="ink faint" d="M42 60 L78 60" stroke-width="1" stroke-dasharray="3 2"/>
  <!-- offered item (fish hook) -->
  <path class="ink" d="M48 54 Q52 48 56 54" stroke-width="1.1"/>
  <text class="label" x="44" y="46">trade</text>
  <text class="label" x="44" y="52">first</text>
  <!-- held back route -->
  <path class="ink faint" d="M52 78 L68 78 M60 74 L60 82" stroke-width="1.2"/>
  <text class="label" x="38" y="88">maps no</text>
  <text class="label" x="38" y="95">names no</text>
</svg>
