<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Mistake do not repeat">
  <defs>
    <style>
      .ink { fill: none; stroke: #3a3228; stroke-linecap: round; stroke-linejoin: round; }
      .faint { opacity: 0.4; }
      .label { font: 6px "Segoe Print", "Bradley Hand", cursive; fill: #4a4034; }
    </style>
  </defs>
  <!-- bad setup sketch (tent in hollow) -->
  <path class="ink faint" d="M38 78 L58 52 L78 78 Z" stroke-width="1.2"/>
  <path class="ink faint" d="M30 82 Q60 90 90 82" stroke-width="1"/>
  <!-- big X -->
  <path class="ink" d="M28 32 L92 88 M92 32 L28 88" stroke-width="2.2"/>
  <!-- correction loop -->
  <path class="ink" d="M82 18 Q98 18 98 32 Q98 46 82 46 Q72 46 72 36" stroke-width="1.2"/>
  <path class="ink" d="M72 36 L68 32 M72 36 L76 32" stroke-width="1"/>
  <text class="label" x="14" y="104">do not repeat</text>
  <text class="label" x="14" y="96">mark map</text>
</svg>
