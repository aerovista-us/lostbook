<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Shared warmth soup">
  <defs>
    <style>
      .ink { fill: none; stroke: #3a3228; stroke-linecap: round; stroke-linejoin: round; }
      .faint { opacity: 0.42; }
      .label { font: 6px "Segoe Print", "Bradley Hand", cursive; fill: #4a4034; }
    </style>
  </defs>
  <!-- bowl -->
  <path class="ink" d="M28 58 Q60 88 92 58" stroke-width="1.6"/>
  <path class="ink" d="M32 58 L32 48 Q60 38 88 48 L88 58" stroke-width="1.4"/>
  <!-- steam -->
  <path class="ink faint" d="M48 42 Q44 32 48 24 M60 40 Q56 28 60 18 M72 42 Q76 30 72 22" stroke-width="1"/>
  <!-- spoon -->
  <path class="ink" d="M78 52 L98 36" stroke-width="1.2"/>
  <ellipse class="ink faint" cx="100" cy="34" rx="4" ry="3" stroke-width="1"/>
  <!-- portion line -->
  <path class="ink faint" d="M38 54 L82 54" stroke-width="0.8" stroke-dasharray="2 2"/>
  <text class="label" x="34" y="72">half now</text>
  <text class="label" x="34" y="80">warmth yes</text>
  <text class="label" x="34" y="88">story no</text>
</svg>
