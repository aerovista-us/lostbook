<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Knot diagram">
  <defs>
    <style>
      .ink { fill: none; stroke: #3a3228; stroke-linecap: round; stroke-linejoin: round; }
      .faint { opacity: 0.4; }
      .label { font: 6px "Segoe Print", "Bradley Hand", cursive; fill: #4a4034; }
    </style>
  </defs>
  <!-- rope loops -->
  <path class="ink" d="M30 68 C30 40 90 40 90 68 C90 88 30 88 30 68 Z" stroke-width="1.6"/>
  <path class="ink" d="M42 68 C42 52 78 52 78 68" stroke-width="1.3"/>
  <path class="ink faint" d="M48 68 L72 68" stroke-width="1"/>
  <!-- working end -->
  <path class="ink" d="M90 68 L104 58 M104 58 L108 64" stroke-width="1.4"/>
  <text class="label" x="14" y="44">standing</text>
  <text class="label" x="14" y="51">part</text>
  <text class="label" x="86" y="52">tail out</text>
  <path class="ink faint" d="M20 80 L28 88 M24 76 L32 84" stroke-width="0.6"/>
</svg>
